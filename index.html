<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAFIQXWORLD Interface</title>

  <!-- Preloading Critical Image Assets -->
  <link rel="preload" as="image" href="assets/RC20.png">
  <link rel="preload" as="image" href="assets/RC24.png">
  <link rel="preload" as="image" href="assets/ACCESSORIES.png">
  <link rel="preload" as="image" href="assets/face.png">

  <!-- Three.js Library & Loaders (For 3D Viewers) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

  <style>
    /* ==========================================================================
       1. CORE RESET & THEME VARIABLES
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      user-select: none;
    }

    :root {
      --bg-color: #030812;
      --text-main: #FFFFFF;
      --text-sub: #557599;
      --card-bg: rgba(8, 18, 36, 0.94);
      --card-border: #14375E;
      --nav-bg: rgba(6, 16, 32, 0.95);
      --accent-blue: #0088FF;
      --accent-glow: rgba(0, 136, 255, 0.4);
      --wa-green: #25D366;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 2.5rem 1rem 6.5rem 1rem;
    }

    /* Active Background when inside 3D Viewers */
    body.viewer-active {
      background: var(--bg-color) url('assets/custom_background.png') no-repeat center center / cover;
      overflow: hidden;
      padding: 0;
    }

    /* ==========================================================================
       2. ZERO-COST AMBIENT GLOWS
       ========================================================================== */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      transform: translateZ(0);
    }

    .glow-top-left {
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 136, 255, 0.22) 0%, rgba(0, 136, 255, 0.08) 45%, rgba(3, 8, 18, 0) 70%);
    }

    .glow-bottom-right {
      bottom: -80px;
      right: -80px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(20, 55, 94, 0.4) 0%, rgba(20, 55, 94, 0.1) 50%, rgba(3, 8, 18, 0) 70%);
    }

    /* ==========================================================================
       3. APP CONTAINMENT WRAPPER & VIEWS
       ========================================================================== */
    .app-wrapper {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      contain: layout style;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin-top: 0.5rem;
      margin-bottom: 2rem;
    }

    .logo-headline {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--text-main);
      line-height: 1.1;
    }

    .glow-x {
      color: var(--accent-blue);
      text-shadow: 0 0 14px rgba(0, 136, 255, 0.8);
    }

    .view-panel {
      display: none;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      min-height: 200px;
      contain: layout style;
    }

    .view-panel.active {
      display: flex;
    }

    @keyframes slideInLeftOnly {
      0% { transform: translate3d(-100%, 0, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    @keyframes swipeUpOnly {
      0% { transform: translate3d(0, 50px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    .animate-in {
      will-change: transform;
      animation: slideInLeftOnly 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-up {
      will-change: transform;
      animation: swipeUpOnly 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 0.08s; }
    .delay-3 { animation-delay: 0.16s; }
    .delay-4 { animation-delay: 0.24s; }

    .box-3-2 {
      display: block;
      text-decoration: none;
      color: inherit;
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: 16px;
      border: 2px solid var(--card-border);
      background: var(--card-bg);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      transform: translateZ(0);
      transition: border-color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .box-3-2:active,
    .box-3-2:hover {
      border-color: var(--accent-blue);
      transform: scale(0.99);
    }

    .box-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* ==========================================================================
       4. WHATSAPP CHANNEL BANNER
       ========================================================================== */
    .whatsapp-card {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      width: 100%;
      padding: 1.1rem 1.25rem;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      margin-top: 0.5rem;
      opacity: 0;
      transform: translate3d(0, 40px, 0);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.2s ease, box-shadow 0.2s ease;
      will-change: transform, opacity;
    }

    .whatsapp-card.visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .whatsapp-card:hover,
    .whatsapp-card:active {
      border-color: var(--wa-green);
      box-shadow: 0 0 16px rgba(37, 211, 102, 0.3);
    }

    .wa-icon-box {
      width: 48px;
      height: 48px;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid var(--wa-green);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--wa-green);
      flex-shrink: 0;
      animation: waGlowPulse 2.5s infinite ease-in-out;
    }

    @keyframes waGlowPulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    .wa-icon-box svg {
      width: 26px;
      height: 26px;
      stroke: var(--wa-green);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wa-text {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    /* ==========================================================================
       5. SETTINGS & ABOUT VIEWS
       ========================================================================== */
    .locked-card {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      min-height: 320px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    .chain-x-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .chain-line {
      stroke: var(--card-border);
      stroke-width: 4;
      stroke-dasharray: 12, 8;
      opacity: 0.65;
    }

    .chain-line-glow {
      stroke: var(--accent-blue);
      stroke-width: 2;
      stroke-dasharray: 12, 8;
      opacity: 0.45;
    }

    .locked-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
      background: rgba(3, 8, 18, 0.9);
      padding: 1.75rem 2rem;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .lock-icon-box {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 136, 255, 0.1);
      border: 1px solid var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lock-icon-box svg {
      width: 32px;
      height: 32px;
      stroke: var(--accent-blue);
      fill: none;
      stroke-width: 2;
    }

    .locked-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .locked-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .changelog-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .changelog-card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-blue);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .version-badge {
      font-size: 0.85rem;
      font-weight: 800;
      background: rgba(0, 136, 255, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 136, 255, 0.4);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    .changelog-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .changelog-item {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       6. 3D VIEWERS SHARED UI STYLES
       ========================================================================== */
    #webgl-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: none;
    }

    .viewer-ui {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: none;
    }

    .viewer-ui * {
      pointer-events: auto;
    }

    @keyframes slideInLeft {
      from { transform: translate3d(-100px, 0, 0); opacity: 0; }
      to { transform: translate3d(0, 0, 0); opacity: 1; }
    }

    @keyframes swipeDown {
      from { transform: translate3d(0, -100px, 0); opacity: 0; }
      to { transform: translate3d(0, 0, 0); opacity: 1; }
    }

    @keyframes swipeUp {
      from { transform: translate3d(0, 100px, 0); opacity: 0; }
      to { transform: translate3d(0, 0, 0); opacity: 1; }
    }

    .top-left-btn {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
      width: 48px;
      height: 48px;
      aspect-ratio: 1 / 1;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      cursor: pointer;
    }

    .top-left-btn svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-main);
      fill: none;
      stroke-width: 2;
    }

    .auto-rotate-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      padding: 0.75rem 1.25rem;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      animation: swipeDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      cursor: pointer;
    }

    .auto-rotate-btn.active {
      border-color: var(--accent-blue);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .menu-box {
      position: absolute;
      bottom: 1.25rem;
      left: 1.25rem;
      width: clamp(260px, 80vw, 320px);
      max-height: 80vh;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      animation: swipeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow: hidden;
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }

    .menu-title {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-blue);
      text-transform: uppercase;
    }

    .eye-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem;
    }

    .eye-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .menu-body {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      overflow-y: auto;
      max-height: 55vh;
      padding-right: 2px;
    }

    .menu-box.collapsed .menu-body {
      display: none;
    }

    .menu-btn {
      width: 100%;
      padding: 0.75rem;
      background: rgba(3, 8, 18, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transform: translate3d(-100px, 0, 0);
      flex-shrink: 0;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .menu-btn.slide-active {
      animation: slideInLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .menu-btn:active,
    .menu-btn.active {
      border-color: var(--accent-blue);
      background: rgba(0, 136, 255, 0.15);
    }

    .menu-btn-upload {
      border-color: rgba(0, 136, 255, 0.5);
    }

    .file-input-el {
      display: none;
    }

    /* ==========================================================================
       7. FLOATING PILL NAVIGATION
       ========================================================================== */
    .nav-container {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%) translateZ(0);
      display: flex;
      align-items: center;
      gap: 1.8rem;
      background: var(--nav-bg);
      border: 1px solid var(--card-border);
      border-radius: 50px;
      padding: 0.8rem 2.2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      padding: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: color 0.15s ease;
    }

    .nav-btn svg {
      width: 26px;
      height: 26px;
      stroke-width: 1.8;
      stroke: currentColor;
      fill: none;
    }

    .nav-btn.active {
      color: var(--accent-blue);
    }

    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      width: 14px;
      height: 3px;
      border-radius: 2px;
      background-color: var(--accent-blue);
      box-shadow: 0 0 6px #0088FF;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND GLOWS -->
  <div class="ambient-glow glow-top-left"></div>
  <div class="ambient-glow glow-bottom-right"></div>

  <!-- MAIN APP CONTAINER -->
  <div class="app-wrapper">

    <header class="header" id="mainHeader">
      <h1 class="logo-headline">RAFIQ<span class="glow-x">X</span>WORLD</h1>
    </header>

    <!-- VIEW 1: HOME -->
    <main class="view-panel active" id="view-home">
      <a href="#rc20" class="box-3-2 animate-in delay-1 nav-trigger" data-viewer="rc20">
        <img src="assets/RC20.png" alt="RC20" class="box-img" decoding="async" fetchpriority="high">
      </a>

      <a href="#rc24" class="box-3-2 animate-in delay-2 nav-trigger" data-viewer="rc24">
        <img src="assets/RC24.png" alt="RC24" class="box-img" decoding="async" fetchpriority="high">
      </a>

      <a href="#accessories" class="box-3-2 animate-in delay-3 nav-trigger" data-viewer="accessories">
        <img src="assets/ACCESSORIES.png" alt="ACCESSORIES" class="box-img" decoding="async" fetchpriority="high">
      </a>

      <a href="#face" class="box-3-2 animate-in delay-4 nav-trigger" data-viewer="face">
        <img src="assets/face.png" alt="FACE" class="box-img" decoding="async" fetchpriority="high">
      </a>

      <!-- WHATSAPP BANNER -->
      <a 
        href="https://whatsapp.com/channel/0029Vb8B7vkKAwEtSJVgh83o" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="whatsapp-card" 
        id="waChannelBtn"
      >
        <div class="wa-icon-box">
          <svg viewBox="0 0 24 24">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
        </div>
        <span class="wa-text">WhatsApp Channel</span>
      </a>
    </main>

    <!-- VIEW 2: SETTINGS -->
    <section class="view-panel" id="view-settings">
      <div class="locked-card delay-1">
        <svg class="chain-x-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="0" y1="0" x2="100" y2="100" class="chain-line" />
          <line x1="100" y1="0" x2="0" y2="100" class="chain-line" />
          <line x1="0" y1="0" x2="100" y2="100" class="chain-line-glow" />
          <line x1="100" y1="0" x2="0" y2="100" class="chain-line-glow" />
        </svg>

        <div class="locked-content">
          <div class="lock-icon-box">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h2 class="locked-title">SETTINGS LOCKED</h2>
          <p class="locked-desc">This section is currently restricted</p>
        </div>
      </div>
    </section>

    <!-- VIEW 3: ABOUT -->
    <section class="view-panel" id="view-about">
      <div class="changelog-card delay-1">
        <div class="changelog-card-title">
          <span>Change Logs</span>
          <span class="version-badge">1.0</span>
        </div>
        <ul class="changelog-list">
          <li class="changelog-item">- RC20 JERSEY CHECKER</li>
          <li class="changelog-item">- RC24 JERSEY CHECKER</li>
          <li class="changelog-item">- ACCESSORIES CHECKER</li>
          <li class="changelog-item">- FACE CHECKER</li>
        </ul>
      </div>
    </section>

  </div>

  <!-- SHARED 3D WEBGL CONTAINER -->
  <div id="webgl-container"></div>

  <!-- VIEWER UI OVERLAYS -->
  <!-- RC20 UI -->
  <div class="viewer-ui" id="ui-rc20">
    <button class="top-left-btn back-home-btn" aria-label="Go Back">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <button class="auto-rotate-btn" data-viewer-target="rc20">Auto Rotate Off</button>
    <div class="menu-box">
      <div class="menu-header">
        <span class="menu-title">MODEL MENU</span>
        <button class="eye-btn"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <div class="menu-body">
        <button class="menu-btn menu-btn-upload upload-trigger"><span>UPLOAD PNG</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></button>

  <!-- UNIFIED APP & THREE.JS LOGIC -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // --- UI & TAB SWITCHING ---
      const navButtons = document.querySelectorAll(".nav-btn");
      const viewPanels = document.querySelectorAll(".view-panel");
      const homePanel = document.getElementById("view-home");
      if (homePanel) homePanel.dataset.animated = "true";

      navButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.classList.contains("active")) return;
          const targetViewId = btn.getAttribute("data-target");
          navButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          viewPanels.forEach((panel) => {
            if (panel.id === targetViewId) {
              panel.classList.add("active");
              if (!panel.dataset.animated) {
                panel.dataset.animated = "true";
                const animTarget = panel.querySelector(".locked-card, .changelog-card");
                if (animTarget) {
                  requestAnimationFrame(() => {
                    requestAnimationFrame(() => animTarget.classList.add("animate-up"));
                  });
                }
              }
            } else {
              panel.classList.remove("active");
            }
          });
        });
      });

      const waBtn = document.getElementById("waChannelBtn");
      if (waBtn) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });
        observer.observe(waBtn);
      }

      // --- THREE.JS ENGINE & VIEWERS MANAGER ---
      let scene, camera, renderer, controls;
      let currentModel = null;
      let activeViewer = null;
      let isAutoRotating = false;

      const webglContainer = document.getElementById("webgl-container");
      const appWrapper = document.querySelector(".app-wrapper");
      const mainNav = document.getElementById("mainNav");

      // Model states per viewer
      const modelCache = new Map();
      const sharedAccessoriesModels = ["cap.obj", "helmet.obj", "keeper.obj"];
      let sharedAccessoriesTexture = null;
      const accessoriesIndividualTextures = new Map();
      let rc20Texture = null;
      let rc24Texture = null;
      let faceTexture = null;

      function initEngine() {
        if (renderer) return;
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 10000);

        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        webglContainer.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const mainDirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainDirLight.position.set(5, 10, 7);
        scene.add(mainDirLight);
        const fillLight = new THREE.DirectionalLight(0x0088ff, 0.4);
        fillLight.position.set(-5, -5, -5);
        scene.add(fillLight);

        function animate() {
          requestAnimationFrame(animate);
          if (isAutoRotating && currentModel) {
            currentModel.rotation.y += 0.01;
          }
          controls.update();
          renderer.render(scene, camera);
        }
        animate();
      }

      function switchViewer(viewerName) {
        initEngine();
        activeViewer = viewerName;

        // Hide home interface & nav, show viewer container & ui
        appWrapper.style.display = "none";
        mainNav.style.display = "none";
        document.body.classList.add("viewer-active");
        webglContainer.style.display = "block";

        document.querySelectorAll(".viewer-ui").forEach(ui => ui.style.display = "none");
        const targetUi = document.getElementById(`ui-${viewerName}`);
        if (targetUi) {
          targetUi.style.display = "block";
          triggerAnimations(targetUi);
        }

        // Load specific default model & texture for the chosen viewer
        if (viewerName === "rc20") {
          loadModel("batsman_full.obj", rc20Texture, true);
        } else if (viewerName === "rc24") {
          loadModel("rc24.obj", rc24Texture, true);
        } else if (viewerName === "accessories") {
          loadModel("cap.obj", sharedAccessoriesTexture, false);
        } else if (viewerName === "face") {
          loadModel("face.obj", faceTexture, false);
        }
      }

      function returnHome() {
        activeViewer = null;
        if (currentModel) {
          scene.remove(currentModel);
          currentModel = null;
        }
        webglContainer.style.display = "none";
        document.querySelectorAll(".viewer-ui").forEach(ui => ui.style.display = "none");
        document.body.classList.remove("viewer-active");
        appWrapper.style.display = "flex";
        mainNav.style.display = "flex";
      }

      function triggerAnimations(uiElement) {
        const allBtns = uiElement.querySelectorAll(".menu-btn");
        allBtns.forEach((btn, index) => {
          btn.classList.remove("slide-active");
          btn.style.animationDelay = `${index * 0.08}s`;
          void btn.offsetWidth;
          btn.classList.add("slide-active");
        });
      }

      function loadModel(fileName, textureToApply, normalizeScale) {
        if (currentModel) scene.remove(currentModel);

        if (modelCache.has(fileName)) {
          displayModel(modelCache.get(fileName).clone(), textureToApply, normalizeScale);
          return;
        }

        const loader = new THREE.OBJLoader();
        loader.load(`assets/${fileName}`, (obj) => {
          modelCache.set(fileName, obj);
          displayModel(obj.clone(), textureToApply, normalizeScale);
        }, undefined, (err) => console.warn(`Error loading assets/${fileName}:`, err));
      }

      function displayModel(obj, texture, normalizeScale) {
        currentModel = obj;
        obj.traverse((child) => {
          if (child.isMesh) {
            child.geometry.computeBoundingBox();
            child.geometry.computeBoundingSphere();
          }
        });

        const box = new THREE.Box3().setFromObject(obj);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        obj.position.x = -center.x;
        obj.position.y = -center.y;
        obj.position.z = -center.z;

        if (normalizeScale) {
          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 0) {
            const scale = 2.0 / maxDim;
            obj.scale.set(scale, scale, scale);
          }
          camera.position.set(0, 1.2, 3.5);
          controls.target.set(0, 0, 0);
          controls.maxDistance = 10;
          controls.minDistance = 0.8;
        } else {
          const maxDim = Math.max(size.x, size.y, size.z);
          const radius = maxDim > 0 ? maxDim / 2 : 1;
          const fovRad = (camera.fov * Math.PI) / 180;
          let cameraDistance = Math.abs(radius / Math.sin(fovRad / 2)) * 1.4;
          camera.position.set(0, cameraDistance * 0.3, cameraDistance);
          camera.near = cameraDistance / 1000;
          camera.far = cameraDistance * 1000;
          camera.updateProjectionMatrix();
          controls.target.set(0, 0, 0);
          controls.minDistance = cameraDistance * 0.05;
          controls.maxDistance = cameraDistance * 20;
        }

        applyMaterial(currentModel, texture);
        scene.add(currentModel);
        controls.update();
      }

      function applyMaterial(model, texture) {
        if (!model) return;
        model.traverse((child) => {
          if (child.isMesh) {
            if (texture) {
              child.material = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide
              });
            } else {
              child.material = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                roughness: 0.5,
                metalness: 0.1
              });
            }
            child.material.needsUpdate = true;
          }
        });
      }

      // --- BINDING EVENTS FOR VIEWERS ---
      document.querySelectorAll(".nav-trigger").forEach(trigger => {
        trigger.addEventListener("click", (e) => {
          e.preventDefault();
          switchViewer(trigger.getAttribute("data-viewer"));
        });
      });

      document.querySelectorAll(".back-home-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          returnHome();
        });
      });

      document.querySelectorAll(".auto-rotate-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          isAutoRotating = !isAutoRotating;
          document.querySelectorAll(".auto-rotate-btn").forEach(b => {
            b.textContent = isAutoRotating ? "Auto Rotate On" : "Auto Rotate Off";
            b.classList.toggle("active", isAutoRotating);
          });
        });
      });

      document.querySelectorAll(".viewer-ui").forEach(ui => {
        const eyeBtn = ui.querySelector(".eye-btn");
        const menuBox = ui.querySelector(".menu-box");
        const eyeIcon = eyeBtn.querySelector("svg");
        const uploadBtn = ui.querySelector(".upload-trigger");
        const fileInput = ui.querySelector(".file-input-el");
        const modelSwitchers = ui.querySelectorAll(".model-switcher");

        if (eyeBtn) {
          eyeBtn.addEventListener("click", () => {
            const isCollapsed = menuBox.classList.toggle("collapsed");
            if (isCollapsed) {
              eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            } else {
              eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
              triggerAnimations(menuBox);
            }
          });
        }

        if (uploadBtn && fileInput) {
          uploadBtn.addEventListener("click", () => fileInput.click());
          fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (event) => {
                new THREE.TextureLoader().load(event.target.result, (tex) => {
                  tex.encoding = THREE.sRGBEncoding;
                  tex.wrapS = THREE.RepeatWrapping;
                  tex.wrapT = THREE.RepeatWrapping;
                  tex.flipY = true;
                  tex.needsUpdate = true;

                  if (activeViewer === "rc20") {
                    rc20Texture = tex;
                  } else if (activeViewer === "rc24") {
                    rc24Texture = tex;
                  } else if (activeViewer === "face") {
                    faceTexture = tex;
                  } else if (activeViewer === "accessories") {
                    const activeModelBtn = ui.querySelector(".model-switcher.active");
                    const activeModelFile = activeModelBtn ? activeModelBtn.getAttribute("data-model") : "cap.obj";
                    if (sharedAccessoriesModels.includes(activeModelFile)) {
                      sharedAccessoriesTexture = tex;
                    } else {
                      accessoriesIndividualTextures.set(activeModelFile, tex);
                    }
                  }
                  applyMaterial(currentModel, tex);
                });
              };
              reader.readAsDataURL(file);
            }
          });
        }

        modelSwitchers.forEach(btn => {
          btn.addEventListener("click", () => {
            modelSwitchers.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            const fileName = btn.getAttribute("data-model");
            let texToUse = null;
            if (activeViewer === "rc20") {
              texToUse = rc20Texture;
            } else if (activeViewer === "accessories") {
              texToUse = sharedAccessoriesModels.includes(fileName) ? sharedAccessoriesTexture : (accessoriesIndividualTextures.get(fileName) || null);
            }
            loadModel(fileName, texToUse, activeViewer === "rc20");
          });
        });
      });

      window.addEventListener("resize", () => {
        if (!renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    });
  </script>

  <!-- Include Global Audio Manager -->
  <script src="audio-manager.js"></script>
