  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    [hidden] {
      display: none !important;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #0c1c2e 0%, #03070d 100%);
      color: #00a2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.day-mode {
      background: radial-gradient(circle at 50% 30%, #eef6ff 0%, #cce3f8 100%);
      color: #0066cc;
    }

    aside#splash {
      position: fixed;
      inset: 0;
      background: #03070d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: dismissSplash 0.35s cubic-bezier(0.4, 0, 0.2, 1) 0.35s forwards;
      pointer-events: none;
    }

    aside#splash h2 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: none;
      animation: pulseLogo 0.35s ease-in-out infinite alternate;
    }

    aside#splash h2 span {
      color: #00a2ff;
      text-shadow: 0 0 12px rgba(0, 162, 255, 0.9), 0 0 24px rgba(0, 162, 255, 0.6);
    }

    header.app-header {
      width: 100%;
      max-width: 430px;
      padding: 12px 20px 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-bottom: 2px solid #00a2ff;
      box-shadow: 0 4px 15px rgba(0, 162, 255, 0.4);
      flex-shrink: 0;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    body.day-mode header.app-header {
      border-bottom-color: #0088ff;
      box-shadow: 0 4px 15px rgba(0, 136, 255, 0.25);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: none;
      transition: color 0.3s;
    }

    body.day-mode h1 {
      color: #0f233c;
    }

    h1 span {
      color: #00a2ff;
      text-shadow: 0 0 10px rgba(0, 162, 255, 0.9), 0 0 20px rgba(0, 162, 255, 0.6);
    }

    main {
      width: 100%;
      max-width: 430px;
      padding: 12px 16px 75px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      overflow-y: auto;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }

    section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    section#notification-view h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    body.day-mode section#notification-view h2 {
      color: #0f233c;
    }

    #home-view article {
      background-color: #060c14;
      border: 2px solid #00a2ff;
      border-radius: 16px;
      aspect-ratio: 1080 / 720;
      box-shadow: 0 0 16px rgba(0, 162, 255, 0.4), inset 0 0 12px rgba(0, 162, 255, 0.2);
      flex-shrink: 0;
      overflow: hidden;
      transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    body.app-booting #home-view article {
      opacity: 0;
      animation: slideInFade 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    body.app-booting #home-view article:nth-of-type(1) { animation-delay: 0.35s; }
    body.app-booting #home-view article:nth-of-type(2) { animation-delay: 0.45s; }
    body.app-booting #home-view article:nth-of-type(3) { animation-delay: 0.55s; }

    body.day-mode #home-view article {
      background-color: #ffffff;
      border-color: #0088ff;
      box-shadow: 0 4px 16px rgba(0, 136, 255, 0.2);
    }

    #home-view article img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    hr {
      border: none;
      height: 3px;
      background-color: #00a2ff;
      box-shadow: 0 0 10px #00a2ff;
      border-radius: 2px;
      flex-shrink: 0;
    }

    form.settings-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label.setting-row {
      background-color: #060c14;
      border: 2px solid #00a2ff;
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 16px rgba(0, 162, 255, 0.4);
      color: #00a2ff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s, color 0.3s;
    }

    body.day-mode label.setting-row {
      background-color: #ffffff;
      border-color: #0088ff;
      color: #0f233c;
      box-shadow: 0 4px 16px rgba(0, 136, 255, 0.2);
    }

    label.setting-row input[type="checkbox"] {
      display: none;
    }

    span.toggle-track {
      position: relative;
      width: 52px;
      height: 28px;
      background-color: #091524;
      border: 2px solid #00a2ff;
      border-radius: 20px;
      transition: background-color 0.3s, border-color 0.3s;
    }

    span.toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background-color: #00a2ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00a2ff;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
    }

    label.setting-row input[type="checkbox"]:checked + span.toggle-track {
      background-color: #00a2ff;
      border-color: #00a2ff;
    }

    label.setting-row input[type="checkbox"]:checked + span.toggle-track span.toggle-thumb {
      transform: translateX(24px);
      background-color: #ffffff;
      box-shadow: 0 0 8px #ffffff;
    }

    ul#notification-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    ul#notification-list li {
      background-color: #060c14;
      border: 2px solid #00a2ff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 16px rgba(0, 162, 255, 0.4);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    body.day-mode ul#notification-list li {
      background-color: #ffffff;
      border-color: #0088ff;
      box-shadow: 0 4px 16px rgba(0, 136, 255, 0.2);
    }

    ul#notification-list li strong {
      color: #ffffff;
      font-size: 1rem;
    }

    body.day-mode ul#notification-list li strong {
      color: #0f233c;
    }

    ul#notification-list li p {
      color: #00a2ff;
      font-size: 0.875rem;
      line-height: 1.4;
    }

    body.day-mode ul#notification-list li p {
      color: #5c7899;
    }

    ul#notification-list li time {
      font-size: 0.7rem;
      color: #4a6d91;
      align-self: flex-end;
    }

    p#no-notifications-msg,
    p#no-chat-msg {
      text-align: center;
      padding: 30px 20px;
      color: #4a6d91;
      font-size: 0.95rem;
      font-weight: 600;
    }

    section#chat-view {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      gap: 8px;
    }

    header#chat-profile-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background-color: #060c14;
      border: 2px solid #00a2ff;
      border-radius: 14px;
      box-shadow: 0 0 12px rgba(0, 162, 255, 0.3);
      flex-shrink: 0;
    }

    body.day-mode header#chat-profile-bar {
      background-color: #ffffff;
      border-color: #0088ff;
      box-shadow: 0 4px 12px rgba(0, 136, 255, 0.15);
    }

    label.pfp-label {
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    img#chat-user-pfp-preview {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00a2ff;
      box-shadow: 0 0 8px rgba(0, 162, 255, 0.5);
    }

    input#chat-username-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      outline: none;
    }

    body.day-mode input#chat-username-input {
      color: #0f233c;
    }

    ul#chat-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      overscroll-behavior-y: contain;
    }

    ul#chat-list li {
      background-color: #060c14;
      border: 1.5px solid #00a2ff;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 0 10px rgba(0, 162, 255, 0.25);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    body.day-mode ul#chat-list li {
      background-color: #ffffff;
      border-color: #0088ff;
      box-shadow: 0 2px 8px rgba(0, 136, 255, 0.12);
    }

    ul#chat-list li img.chat-msg-pfp {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #00a2ff;
      flex-shrink: 0;
    }

    ul#chat-list li section.msg-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    ul#chat-list li header.msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    ul#chat-list li header.msg-header strong {
      color: #ffffff;
      font-size: 0.85rem;
    }

    body.day-mode ul#chat-list li header.msg-header strong {
      color: #0f233c;
    }

    ul#chat-list li header.msg-header time {
      font-size: 0.65rem;
      color: #4a6d91;
    }

    ul#chat-list li p {
      color: #00a2ff;
      font-size: 0.88rem;
      line-height: 1.35;
      word-break: break-word;
      user-select: text;
    }

    body.day-mode ul#chat-list li p {
      color: #0f233c;
    }

    form#chat-form {
      display: flex;
      flex-direction: row;
      gap: 8px;
      flex-shrink: 0;
    }

    input#chat-input {
      flex: 1;
      background-color: #060c14;
      border: 2px solid #00a2ff;
      border-radius: 12px;
      padding: 12px 14px;
      color: #00a2ff;
      font-size: 0.9rem;
      outline: none;
      box-shadow: 0 0 10px rgba(0, 162, 255, 0.2);
    }

    body.day-mode input#chat-input {
      background-color: #ffffff;
      border-color: #0088ff;
      color: #0f233c;
      box-shadow: 0 2px 10px rgba(0, 136, 255, 0.1);
    }

    button#chat-send-btn {
      background-color: #00a2ff;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      color: #040912;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 162, 255, 0.5);
    }

    body.day-mode button#chat-send-btn {
      background-color: #0088ff;
      color: #ffffff;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: #040912;
      border-top: 1px solid #0f243f;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 14px;
      z-index: 100;
      transition: background 0.3s, border-color 0.3s;
    }

    body.day-mode nav {
      background: #ffffff;
      border-top-color: #c0d8f0;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
    }

    nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #4a6d91;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 500;
      position: relative;
    }

    body.day-mode nav a {
      color: #5c7899;
    }

    nav a.active {
      color: #00a2ff;
      text-shadow: 0 0 8px rgba(0, 162, 255, 0.9);
    }

    body.day-mode nav a.active {
      color: #0088ff;
      text-shadow: none;
    }

    nav a.active::before {
      content: "";
      position: absolute;
      top: -11px;
      width: 100%;
      height: 3px;
      background-color: #00a2ff;
      box-shadow: 0 0 10px #00a2ff;
      border-radius: 2px;
    }

    body.day-mode nav a.active::before {
      background-color: #0088ff;
      box-shadow: 0 0 8px rgba(0, 136, 255, 0.5);
    }

    nav svg, nav img {
      width: 20px;
      height: 20px;
    }

    nav svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    nav a.active svg {
      fill: #00a2ff;
      stroke: #00a2ff;
      filter: drop-shadow(0 0 8px #00a2ff);
    }

    body.day-mode nav a.active svg {
      fill: #0088ff;
      stroke: #0088ff;
      filter: drop-shadow(0 0 4px rgba(0, 136, 255, 0.4));
    }

    nav a[href="#about"] img {
      object-fit: contain;
      background: rgba(0, 162, 255, 0.18);
      border-radius: 50%;
      padding: 2px;
      box-shadow: 0 0 8px rgba(0, 162, 255, 0.3);
      filter: drop-shadow(0 0 4px rgba(0, 162, 255, 0.6));
    }

    @keyframes dismissSplash {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes pulseLogo {
      from { transform: scale(0.98); opacity: 0.8; }
      to { transform: scale(1.02); opacity: 1; }
    }

    @keyframes slideInFade {
      0% { opacity: 0; transform: translateX(-40px); }
      100% { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body class="app-booting">

  <main>
    <!-- Home View -->
    <section id="home-view">
      <article>
        <img src="assets/RC20.png" alt="RC20">
      </article>
      <hr>
      <article>
        <img src="assets/RC24.png" alt="RC24">
      </article>
      <hr>
      <article>
        <img src="assets/ACCESSORIES.png" alt="ACCESSORIES">
      </article>

    <!-- Settings View -->
    <section id="settings-view" hidden>

  <script>
    const navLinks = document.querySelectorAll('nav a');
    const homeView = document.getElementById('home-view');
    const settingsView = document.getElementById('settings-view');
    const notificationView = document.getElementById('notification-view');
    const chatView = document.getElementById('chat-view');
    const themeToggle = document.getElementById('theme-toggle');
    const notificationToggle = document.getElementById('notification-toggle');

    const defaultPfpSvg = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzAwYTJmZiI+PHBhdGggZD0iTTEyIDJhNSA1IDAgMSAwIDUgNSA1IDUgMCAwIDAtNS01em0wIDEyYy01LjMzIDAtOCAyLjY3LTggNHYyaDE2di0yYzAtMS4zMy0yLjY3LTQtOC00eiIvPjwvc3ZnPg==";

    setTimeout(() => {
      document.body.classList.remove('app-booting');
    }, 1000);

    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const target = link.getAttribute('href');

        navLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');

        homeView.hidden = target !== '#home';
        settingsView.hidden = target !== '#settings';
        notificationView.hidden = target !== '#notification';
        chatView.hidden = target !== '#chat';
      });
    });

    themeToggle.addEventListener('change', () => {
      if (themeToggle.checked) {
        document.body.classList.add('day-mode');
      } else {
        document.body.classList.remove('day-mode');
      }
    });

    function loadNotificationsHistory() {
      const list = document.getElementById('notification-list');
      const emptyMsg = document.getElementById('no-notifications-msg');

      if (!db) return;

      db.ref('notifications').on('value', (snapshot) => {
        list.innerHTML = '';
        const data = snapshot.val();

        if (!data) {
          emptyMsg.hidden = false;
          return;
        }

        emptyMsg.hidden = true;
        const items = Object.values(data).sort((a, b) => (b.created_at || 0) - (a.created_at || 0));

        items.forEach(item => {
          const li = document.createElement('li');
          const titleEl = document.createElement('strong');
          titleEl.textContent = item.title || 'Notification';
          const bodyEl = document.createElement('p');
          bodyEl.textContent = item.body || '';
          const timeEl = document.createElement('time');
          timeEl.textContent = item.timestamp || '';

          li.appendChild(titleEl);
          li.appendChild(bodyEl);
          li.appendChild(timeEl);
          list.appendChild(li);
        });
      }, () => {
        emptyMsg.hidden = false;
      });
    }

    function loadGlobalChat() {
      const chatList = document.getElementById('chat-list');
      const emptyMsg = document.getElementById('no-chat-msg');
      const chatForm = document.getElementById('chat-form');
      const chatInput = document.getElementById('chat-input');

      const usernameInput = document.getElementById('chat-username-input');
      const pfpPreview = document.getElementById('chat-user-pfp-preview');
      const pfpFileInput = document.getElementById('pfp-upload-input');

      let currentUsername = localStorage.getItem('rafiqx_chat_username') || ('User_' + Math.floor(1000 + Math.random() * 9000));
      let currentPfp = localStorage.getItem('rafiqx_chat_pfp') || defaultPfpSvg;

      usernameInput.value = currentUsername;
      pfpPreview.src = currentPfp;

      let chatStore = [];
      try {
        chatStore = JSON.parse(localStorage.getItem('rafiqx_chat_store') || '[]');
        if (!Array.isArray(chatStore)) chatStore = [];
      } catch (e) {
        chatStore = [];
      }

      function renderMessageList(messages) {
        chatList.innerHTML = '';
        if (!messages || messages.length === 0) {
          emptyMsg.hidden = false;
          return;
        }

        emptyMsg.hidden = true;
        messages.forEach(msg => {
          const li = document.createElement('li');
          
          const img = document.createElement('img');
          img.className = 'chat-msg-pfp';
          img.src = msg.pfp || defaultPfpSvg;
          img.alt = msg.user || 'User';

          const msgBody = document.createElement('section');
          msgBody.className = 'msg-body';

          const header = document.createElement('header');
          header.className = 'msg-header';

          const nameEl = document.createElement('strong');
          nameEl.textContent = msg.user || 'User';

          const timeEl = document.createElement('time');
          timeEl.textContent = msg.time || '';

          header.appendChild(nameEl);
          header.appendChild(timeEl);

          const p = document.createElement('p');
          p.textContent = msg.text || '';

          msgBody.appendChild(header);
          msgBody.appendChild(p);

          li.appendChild(img);
          li.appendChild(msgBody);
          chatList.appendChild(li);
        });

        chatList.scrollTop = chatList.scrollHeight;
      }

      renderMessageList(chatStore);

      usernameInput.addEventListener('change', () => {
        const val = usernameInput.value.trim();
        if (val) {
          currentUsername = val;
          localStorage.setItem('rafiqx_chat_username', currentUsername);
        }
      });

      pfpFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 72;
            canvas.height = 72;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 72, 72);
            currentPfp = canvas.toDataURL('image/jpeg', 0.8);
            pfpPreview.src = currentPfp;
            localStorage.setItem('rafiqx_chat_pfp', currentPfp);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });

      if (db) {
        db.ref('global_chat').limitToLast(60).on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            chatStore = Object.values(data);
            localStorage.setItem('rafiqx_chat_store', JSON.stringify(chatStore));
            renderMessageList(chatStore);
          }
        }, (err) => {
          console.warn("Firebase listener rejected access:", err.message);
        });
      }

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;

        const msgObj = {
          user: usernameInput.value.trim() || currentUsername,
          pfp: currentPfp,
          text: text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          created_at: Date.now()
        };

        chatStore.push(msgObj);
        if (chatStore.length > 60) chatStore.shift();
        localStorage.setItem('rafiqx_chat_store', JSON.stringify(chatStore));
        renderMessageList(chatStore);

        if (db) {
          db.ref('global_chat').push(msgObj).catch((err) => {
            console.warn("Database push failed:", err.message);
          });
        }

        chatInput.value = '';
      });
    }

    async function syncNotificationState() {
      if (window.gonative && window.gonative.onesignal) {
        window.gonative.onesignal.user.getSubscription().then(sub => {
          notificationToggle.checked = !!sub.optedIn;
        }).catch(() => {});
      } else {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function(OneSignal) {
          notificationToggle.checked = OneSignal.User.PushSubscription.optedIn;
        });
      }
    }

    notificationToggle.addEventListener('change', async () => {
      const isEnabled = notificationToggle.checked;

      if (window.gonative && window.gonative.onesignal) {
        if (isEnabled) {
          window.gonative.onesignal.register();
          window.gonative.onesignal.user.setPushNotificationPermission(true);
        } else {
          window.gonative.onesignal.user.setPushNotificationPermission(false);
        }
      } else {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function(OneSignal) {
          if (isEnabled) {
            await OneSignal.User.PushSubscription.optIn();
          } else {
            await OneSignal.User.PushSubscription.optOut();
          }
        });
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      syncNotificationState();
      loadNotificationsHistory();
      loadGlobalChat();
    });
  </script>

</body>
</html>
