      width: 52px;
      height: 28px;
      background-color: #091524;
      border: 2px solid #00a2ff;
      border-radius: 20px;
      transition: background-color 0.3s, border-color 0.3s;
    }

      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background-color: #00a2ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00a2ff;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
    }

    label.setting-row input[type="checkbox"]:checked + span.toggle-track {
      background-color: #00a2ff;
      border-color: #00a2ff;
    }

    label.setting-row input[type="checkbox"]:checked + span.toggle-track span.toggle-thumb {

      box-shadow: 0 0 8px #ffffff;

  <script>
    const navLinks = document.querySelectorAll('nav a');
    const homeView = document.getElementById('home-view');
    const settingsView = document.getElementById('settings-view');
    const notificationView = document.getElementById('notification-view');
    const chatView = document.getElementById('chat-view');
    const themeToggle = document.getElementById('theme-toggle');
    const notificationToggle = document.getElementById('notification-toggle');

    const defaultPfpSvg = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzAwYTJmZiI+PHBhdGggZD0iTTEyIDJhNSA1IDAgMSAwIDUgNSA1IDUgMCAwIDAtNS01em0wIDEyYy01LjMzIDAtOCAyLjY3LTggNHYyaDE2di0yYzAtMS4zMy0yLjY3LTQtOC00eiIvPjwvc3ZnPg==";

    setTimeout(() => {
      document.body.classList.remove('app-booting');
    }, 1000);

    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const target = link.getAttribute('href');

        navLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');

        homeView.hidden = target !== '#home';
        settingsView.hidden = target !== '#settings';
        notificationView.hidden = target !== '#notification';
        chatView.hidden = target !== '#chat';
      });
    });

    themeToggle.addEventListener('change', () => {
      if (themeToggle.checked) {
        document.body.classList.add('day-mode');
      } else {
        document.body.classList.remove('day-mode');
      }
    });

    function loadNotificationsHistory() {
      const list = document.getElementById('notification-list');
      const emptyMsg = document.getElementById('no-notifications-msg');

      if (!db) return;

      db.ref('notifications').on('value', (snapshot) => {
        list.innerHTML = '';
        const data = snapshot.val();

        if (!data) {
          emptyMsg.hidden = false;
          return;
        }

        emptyMsg.hidden = true;
        const items = Object.values(data).sort((a, b) => (b.created_at || 0) - (a.created_at || 0));

        items.forEach(item => {
          const li = document.createElement('li');
          const titleEl = document.createElement('strong');
          titleEl.textContent = item.title || 'Notification';
          const bodyEl = document.createElement('p');
          bodyEl.textContent = item.body || '';
          const timeEl = document.createElement('time');
          timeEl.textContent = item.timestamp || '';

          li.appendChild(titleEl);
          li.appendChild(bodyEl);
          li.appendChild(timeEl);
          list.appendChild(li);
        });
      }, () => {
        emptyMsg.hidden = false;
      });
    }

    function formatHandle(raw) {
      if (!raw) return '@user';
      let clean = raw.trim().replace(/^@+/, '').replace(/[^a-zA-Z0-9_]/g, '');
      return '@' + (clean || 'user');
    }

    function sanitizeKey(handle) {
      return handle.toLowerCase().replace(/[^a-z0-9_]/g, '');
    }

    function initChatAuth() {
      const chatAuthSection = document.getElementById('chat-auth-section');
      const authForm = document.getElementById('auth-credentials-form');
      const authEmailInput = document.getElementById('auth-email-input');
      const authPasswordInput = document.getElementById('auth-password-input');
      const authStatusMsg = document.getElementById('auth-status-msg');
      const emailSignInBtn = document.getElementById('email-signin-btn');
      const emailSignUpBtn = document.getElementById('email-signup-btn');
      const googleSignInBtn = document.getElementById('google-signin-btn');
      const authDivider = document.getElementById('auth-divider');
      const verificationActions = document.getElementById('verification-actions');
      const resendEmailBtn = document.getElementById('resend-email-btn');
      const checkVerificationBtn = document.getElementById('check-verification-btn');
      const authSignOutBtn = document.getElementById('auth-signout-btn');
      const modalSignOutBtn = document.getElementById('modal-signout-btn');

      const chatProfileBar = document.getElementById('chat-profile-bar');
      const chatList = document.getElementById('chat-list');
      const noChatMsg = document.getElementById('no-chat-msg');
      const chatForm = document.getElementById('chat-form');

      function setAuthStatus(msg, type) {
        authStatusMsg.textContent = msg || '';
        authStatusMsg.className = type || '';
      }

      function showUnverifiedUI(user) {
        chatAuthSection.hidden = false;
        authForm.hidden = true;
        authDivider.hidden = true;
        googleSignInBtn.hidden = true;
        verificationActions.hidden = false;

        chatProfileBar.hidden = true;
        chatList.hidden = true;
        noChatMsg.hidden = true;
        chatForm.hidden = true;

        setAuthStatus("Verification email sent to " + (user.email || 'your email') + ". Please verify to access chat.", "error");
      }

      function showUnauthenticatedUI() {
        chatAuthSection.hidden = false;
        authForm.hidden = false;
        authDivider.hidden = false;
        googleSignInBtn.hidden = false;
        verificationActions.hidden = true;

        chatProfileBar.hidden = true;
        chatList.hidden = true;
        noChatMsg.hidden = true;
        chatForm.hidden = true;

        setAuthStatus("", "");
      }

      function showAuthenticatedUI() {
        chatAuthSection.hidden = true;
        chatProfileBar.hidden = false;
        chatList.hidden = false;
        chatForm.hidden = false;
      }

      if (!auth) {
        setAuthStatus("Firebase auth is not configured.", "error");
        return;
      }

      emailSignInBtn.addEventListener('click', async () => {
        const email = authEmailInput.value.trim();
        const password = authPasswordInput.value.trim();
        if (!email || !password) {
          setAuthStatus("Please enter both email and password.", "error");
          return;
        }
        try {
          const userCred = await auth.signInWithEmailAndPassword(email, password);
          if (!userCred.user.emailVerified) {
            showUnverifiedUI(userCred.user);
          } else {
            setAuthStatus("Signed in successfully!", "success");
          }
        } catch (err) {
          setAuthStatus(err.message, "error");
        }
      });

      emailSignUpBtn.addEventListener('click', async () => {
        const email = authEmailInput.value.trim();
        const password = authPasswordInput.value.trim();
        if (!email || !password) {
          setAuthStatus("Please enter both email and password.", "error");
          return;
        }
        try {
          const userCred = await auth.createUserWithEmailAndPassword(email, password);
          await userCred.user.sendEmailVerification();
          showUnverifiedUI(userCred.user);
        } catch (err) {
          setAuthStatus(err.message, "error");
        }
      });

      googleSignInBtn.addEventListener('click', async () => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider);
        } catch (err) {
          setAuthStatus(err.message, "error");
        }
      });

      resendEmailBtn.addEventListener('click', async () => {
        if (auth.currentUser) {
          try {
            await auth.currentUser.sendEmailVerification();
            setAuthStatus("Verification email resent!", "success");
          } catch (err) {
            setAuthStatus(err.message, "error");
          }
        }
      });

      checkVerificationBtn.addEventListener('click', async () => {
        if (auth.currentUser) {
          await auth.currentUser.reload();
          if (auth.currentUser.emailVerified) {
            showAuthenticatedUI();
            loadGlobalChat(auth.currentUser.uid);
          } else {
            setAuthStatus("Email still not verified. Please check your inbox.", "error");
          }
        }
      });

      const handleSignOut = async () => {
        try {
          await auth.signOut();
          showUnauthenticatedUI();
          const profileModal = document.getElementById('profile-modal');
          if (profileModal.open) {
            if (typeof profileModal.close === 'function') profileModal.close();
            else profileModal.removeAttribute('open');
          }
        } catch (err) {
          console.warn("Sign out error:", err);
        }
      };

      authSignOutBtn.addEventListener('click', handleSignOut);
      modalSignOutBtn.addEventListener('click', handleSignOut);

      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const isGoogle = user.providerData.some(p => p.providerId === 'google.com');
          if (isGoogle || user.emailVerified) {
            showAuthenticatedUI();
            loadGlobalChat(user.uid);
          } else {
            showUnverifiedUI(user);
          }
        } else {
          showUnauthenticatedUI();
        }
      });
    }

    async function loadGlobalChat(currentUserId) {
      const chatList = document.getElementById('chat-list');
      const emptyMsg = document.getElementById('no-chat-msg');
      const chatForm = document.getElementById('chat-form');
      const chatInput = document.getElementById('chat-input');

      const usernameDisplay = document.getElementById('chat-username-display');
      const pfpPreview = document.getElementById('chat-user-pfp-preview');

      const openModalBtn = document.getElementById('open-profile-modal-btn');
      const profileModal = document.getElementById('profile-modal');
      const profileForm = document.getElementById('profile-form');
      const modalUsernameInput = document.getElementById('modal-username-input');
      const modalPfpPreview = document.getElementById('modal-pfp-preview');
      const modalPfpInput = document.getElementById('modal-pfp-input');
      const modalCancelBtn = document.getElementById('modal-cancel-btn');
      const modalSaveBtn = document.getElementById('modal-save-btn');
      const usernameStatus = document.getElementById('username-status');

      const replyBanner = document.getElementById('chat-reply-banner');
      const replyPfp = document.getElementById('reply-banner-pfp');
      const replyUser = document.getElementById('reply-banner-user');
      const replyText = document.getElementById('reply-banner-text');
      const replyCancelBtn = document.getElementById('reply-banner-cancel-btn');

      let activeReply = null;

      try { localStorage.setItem('rafiqx_user_id', currentUserId); } catch(e) {}

      let currentUsername = '@user';
      try {
        const stored = localStorage.getItem('rafiqx_chat_username');
        if (stored) {
          currentUsername = formatHandle(stored);
        } else if (auth && auth.currentUser && auth.currentUser.displayName) {
          currentUsername = formatHandle(auth.currentUser.displayName);
        } else {
          currentUsername = formatHandle('@user_' + currentUserId.substring(0, 4));
        }
      } catch (e) {}

      let currentPfp = defaultPfpSvg;
      try {
        const storedPfp = localStorage.getItem('rafiqx_chat_pfp');
        if (storedPfp) {
          currentPfp = storedPfp;
        } else if (auth && auth.currentUser && auth.currentUser.photoURL) {
          currentPfp = auth.currentUser.photoURL;
        }
      } catch (e) {}

      let tempPfpBuffer = currentPfp;
      let usernameCheckTimeout = null;

      function claimUsernameInDb(newUsername, oldUsername) {
        if (!db) return;
        const newKey = sanitizeKey(newUsername);

        if (oldUsername) {
          const oldKey = sanitizeKey(oldUsername);
          if (oldKey !== newKey) {
            db.ref('usernames/' + oldKey).once('value', (snap) => {
              const val = snap.val();
              if (val && val.userId === currentUserId) {
                db.ref('usernames/' + oldKey).remove().catch(() => {});
              }
            });
          }
        }

        db.ref('usernames/' + newKey).set({ userId: currentUserId, handle: newUsername }).catch(() => {});
        db.ref('users/' + currentUserId).set({ username: newUsername, pfp: currentPfp }).catch(() => {});
      }

      claimUsernameInDb(currentUsername, null);

      function checkUsernameAvailability(inputVal) {
        const formatted = formatHandle(inputVal);
        const searchKey = sanitizeKey(formatted);

        if (searchKey.length < 3) {
          usernameStatus.textContent = 'Handle must be at least 3 characters';
          usernameStatus.className = 'status-taken';
          modalSaveBtn.disabled = true;
          return;
        }

        if (sanitizeKey(currentUsername) === searchKey) {
          usernameStatus.textContent = formatted + ' is available';
          usernameStatus.className = 'status-available';
          modalSaveBtn.disabled = false;
          return;
        }

        if (usernameCheckTimeout) clearTimeout(usernameCheckTimeout);

        usernameCheckTimeout = setTimeout(() => {
          if (db) {
            db.ref('usernames/' + searchKey).once('value').then(snapshot => {
              const data = snapshot.val();
              if (data && data.userId !== currentUserId) {
                usernameStatus.textContent = formatted + ' is taken';
                usernameStatus.className = 'status-taken';
                modalSaveBtn.disabled = true;
              } else {
                usernameStatus.textContent = formatted + ' is available';
                usernameStatus.className = 'status-available';
                modalSaveBtn.disabled = false;
              }
            }).catch(err => {
              console.warn("Username check error:", err);
              usernameStatus.textContent = formatted + ' is available';
              usernameStatus.className = 'status-available';
              modalSaveBtn.disabled = false;
            });
          } else {
            const isTakenLocally = chatStore.some(m => m.userId && m.userId !== currentUserId && sanitizeKey(m.user || '') === searchKey);
            if (isTakenLocally) {
              usernameStatus.textContent = formatted + ' is taken';
              usernameStatus.className = 'status-taken';
              modalSaveBtn.disabled = true;
            } else {
              usernameStatus.textContent = formatted + ' is available';
              usernameStatus.className = 'status-available';
              modalSaveBtn.disabled = false;
            }
          }
        }, 250);
      }

      function updateHeaderDisplay() {
        usernameDisplay.textContent = currentUsername;
        pfpPreview.src = currentPfp;
      }
      updateHeaderDisplay();

      openModalBtn.onclick = () => {
        modalUsernameInput.value = currentUsername;
        modalPfpPreview.src = currentPfp;
        tempPfpBuffer = currentPfp;
        checkUsernameAvailability(currentUsername);

        if (typeof profileModal.showModal === 'function') {
          profileModal.showModal();
        } else {
          profileModal.setAttribute('open', '');
        }
      };

      modalUsernameInput.oninput = (e) => {
        const handle = formatHandle(e.target.value);
        checkUsernameAvailability(handle);
      };

      modalCancelBtn.onclick = () => {
        if (typeof profileModal.close === 'function') {
          profileModal.close();
        } else {
          profileModal.removeAttribute('open');
        }
      };

      modalPfpInput.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onerror = () => console.warn("PFP File Read Error");
        reader.onload = (event) => {
          const img = new Image();
          img.onerror = () => console.warn("PFP Image Load Error");
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = 48;
              canvas.height = 48;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, 48, 48);

              tempPfpBuffer = canvas.toDataURL('image/jpeg', 0.5);
              modalPfpPreview.src = tempPfpBuffer;
            } catch (err) {
              console.warn("Canvas processing error:", err);
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        modalPfpInput.value = '';
      };

      profileForm.onsubmit = (e) => {
        if (modalSaveBtn.disabled) {
          e.preventDefault();
          return;
        }

        const newHandle = formatHandle(modalUsernameInput.value);
        if (newHandle) {
          const oldUsername = currentUsername;
          currentUsername = newHandle;
          currentPfp = tempPfpBuffer;

          try {
            localStorage.setItem('rafiqx_chat_username', currentUsername);
            localStorage.setItem('rafiqx_chat_pfp', currentPfp);
          } catch (e) {}

          claimUsernameInDb(currentUsername, oldUsername);
          updateHeaderDisplay();
          renderMessageList(chatStore);
        }
      };

      let chatStore = [];
      try {
        chatStore = JSON.parse(localStorage.getItem('rafiqx_chat_store') || '[]');
        if (!Array.isArray(chatStore)) chatStore = [];
      } catch (e) {
        chatStore = [];
      }

      function setReplyState(msg) {
        activeReply = {
          user: msg.user ? formatHandle(msg.user) : '@user',
          pfp: msg.pfp || defaultPfpSvg,
          text: msg.text || ''
        };
        replyPfp.src = activeReply.pfp;
        replyUser.textContent = activeReply.user;
        replyText.textContent = activeReply.text;
        replyBanner.hidden = false;
        chatInput.focus();
      }

      function clearReplyState() {
        activeReply = null;
        replyBanner.hidden = true;
      }

      replyCancelBtn.onclick = clearReplyState;

      function renderMessageList(messages) {
        chatList.innerHTML = '';
        if (!messages || messages.length === 0) {
          emptyMsg.hidden = false;
          return;
        }

        emptyMsg.hidden = true;

        messages.forEach(msg => {
          const li = document.createElement('li');
          const isOutgoing = msg.userId === currentUserId;

          li.className = isOutgoing ? 'msg-outgoing' : 'msg-incoming';

          const img = document.createElement('img');
          img.className = 'chat-msg-pfp';
          img.src = msg.pfp || defaultPfpSvg;
          img.alt = msg.user ? formatHandle(msg.user) : '@user';

          const msgBody = document.createElement('section');
          msgBody.className = 'msg-body';

          const header = document.createElement('header');
          header.className = 'msg-header';

          const nameEl = document.createElement('strong');
          nameEl.textContent = msg.user ? formatHandle(msg.user) : '@user';

          const timeEl = document.createElement('time');
          timeEl.textContent = msg.time || '';

          header.appendChild(nameEl);
          header.appendChild(timeEl);

          msgBody.appendChild(header);

          if (msg.replyTo) {
            const quote = document.createElement('blockquote');
            quote.className = 'msg-reply-quote';

            const qImg = document.createElement('img');
            qImg.className = 'chat-msg-pfp';
            qImg.src = msg.replyTo.pfp || defaultPfpSvg;
            qImg.alt = msg.replyTo.user ? formatHandle(msg.replyTo.user) : '@user';

            const qContent = document.createElement('section');
            qContent.className = 'reply-quote-content';

            const qUser = document.createElement('strong');
            qUser.textContent = msg.replyTo.user ? formatHandle(msg.replyTo.user) : '@user';

            const qText = document.createElement('p');
            qText.textContent = msg.replyTo.text || '';

            qContent.appendChild(qUser);
            qContent.appendChild(qText);
            quote.appendChild(qImg);
            quote.appendChild(qContent);

            msgBody.appendChild(quote);
          }

          const p = document.createElement('p');
          p.textContent = msg.text || '';
          msgBody.appendChild(p);

          li.appendChild(img);
          li.appendChild(msgBody);

          let startX = 0;
          let startY = 0;
          let currentX = 0;
          let isSwiping = false;

          li.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isSwiping = true;
            li.style.transition = 'none';
          }, { passive: true });

          li.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            const diffX = e.touches[0].clientX - startX;
            const diffY = e.touches[0].clientY - startY;

            if (diffX > 0 && Math.abs(diffX) > Math.abs(diffY)) {
              currentX = Math.min(diffX, 80);
              li.style.transform = `translateX(${currentX}px)`;
            }
          }, { passive: true });

          li.addEventListener('touchend', () => {
            if (!isSwiping) return;
            isSwiping = false;
            li.style.transition = 'transform 0.2s ease-out';
            li.style.transform = 'translateX(0px)';

            if (currentX > 45) {
              setReplyState(msg);
            }
            currentX = 0;
          });

          chatList.appendChild(li);
        });

        chatList.scrollTop = chatList.scrollHeight;
      }

      renderMessageList(chatStore);

      if (db) {
        db.ref('global_chat').limitToLast(60).on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            chatStore = Object.values(data);
            try {
              localStorage.setItem('rafiqx_chat_store', JSON.stringify(chatStore));
            } catch (e) {}
            renderMessageList(chatStore);
          }
        }, (err) => {
          console.warn("Firebase listener rejected access:", err.message);
        });
      }

      chatForm.onsubmit = (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;

        const msgObj = {
          userId: currentUserId,
          user: currentUsername,
          pfp: currentPfp,
          text: text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          created_at: Date.now()
        };

        if (activeReply) {
          msgObj.replyTo = activeReply;
        }

        chatStore.push(msgObj);
        if (chatStore.length > 60) chatStore.shift();
        
        try {
          localStorage.setItem('rafiqx_chat_store', JSON.stringify(chatStore));
        } catch (e) {}

        renderMessageList(chatStore);

        if (db) {
          db.ref('global_chat').push(msgObj).catch((err) => {
            console.warn("Database push failed:", err.message);
          });
        }

        chatInput.value = '';
        clearReplyState();
      };
    }

    async function syncNotificationState() {
      if (window.gonative && window.gonative.onesignal) {
        window.gonative.onesignal.user.getSubscription().then(sub => {
          notificationToggle.checked = !!sub.optedIn;
        }).catch(() => {});
      } else {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function(OneSignal) {
          notificationToggle.checked = OneSignal.User.PushSubscription.optedIn;
        });
      }
    }

    notificationToggle.addEventListener('change', async () => {
      const isEnabled = notificationToggle.checked;

      if (window.gonative && window.gonative.onesignal) {
        if (isEnabled) {
          window.gonative.onesignal.register();
          window.gonative.onesignal.user.setPushNotificationPermission(true);
        } else {
          window.gonative.onesignal.user.setPushNotificationPermission(false);
        }
      } else {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function(OneSignal) {
          if (isEnabled) {
            await OneSignal.User.PushSubscription.optIn();
          } else {
            await OneSignal.User.PushSubscription.optOut();
          }
        });
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      syncNotificationState();
      loadNotificationsHistory();
      initChatAuth();
    });
  </script>

</body>
</html>
