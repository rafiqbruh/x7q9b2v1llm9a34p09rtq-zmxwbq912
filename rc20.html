<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RC20 3D Viewer - RAFIQXWORLD</title>

    <!-- Local Offline Three.js Engine & Loaders -->
  <script src="js/three.min.js"></script>
  <script src="js/OrbitControls.js"></script>
  <script src="js/OBJLoader.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --bg-color: #030812;
      --card-bg: rgba(8, 18, 36, 0.92);
      --card-border: #14375E;
      --accent-blue: #0088FF;
      --accent-glow: rgba(0, 136, 255, 0.4);
      --text-main: #FFFFFF;
      --text-sub: #557599;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color) url('assets/cbg.png') no-repeat center center / cover;
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .ui-layer * {
      pointer-events: auto;
    }

    /* Keyframe Animations */
    @keyframes slideInLeft {
      from { 
        transform: translate3d(-100px, 0, 0); 
        opacity: 0; 
      }
      to { 
        transform: translate3d(0, 0, 0); 
        opacity: 1; 
      }
    }

    @keyframes swipeDown {
      from { transform: translate3d(0, -100px, 0); opacity: 0; }
      to { transform: translate3d(0, 0, 0); opacity: 1; }
    }

    @keyframes swipeUp {
      from { transform: translate3d(0, 100px, 0); opacity: 0; }
      to { transform: translate3d(0, 0, 0); opacity: 1; }
    }

    /* Top Action Controls */
    .top-left-btn {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
      width: 48px;
      height: 48px;
      aspect-ratio: 1 / 1;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      cursor: pointer;
    }

    .top-left-btn svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-main);
      fill: none;
      stroke-width: 2;
    }

    .auto-rotate-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      padding: 0.75rem 1.25rem;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      animation: swipeDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .auto-rotate-btn.active {
      border-color: var(--accent-blue);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    /* Bottom Left Menu Box */
    .menu-box {
      position: absolute;
      bottom: 1.25rem;
      left: 1.25rem;
      width: clamp(260px, 80vw, 320px);
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      animation: swipeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow: hidden;
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }

    .menu-title {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-blue);
      text-transform: uppercase;
    }

    .eye-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem;
    }

    .eye-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .menu-body {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .menu-box.collapsed .menu-body {
      display: none;
    }

    /* Button Slide Animation */
    .menu-btn {
      width: 100%;
      padding: 0.75rem;
      background: rgba(3, 8, 18, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transform: translate3d(-100px, 0, 0);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .menu-btn.slide-active {
      animation: slideInLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .menu-btn:active,
    .menu-btn.active {
      border-color: var(--accent-blue);
      background: rgba(0, 136, 255, 0.15);
    }

    .menu-btn-upload {
      border-color: rgba(0, 136, 255, 0.5);
    }

    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <div id="webgl-container"></div>

  <div class="ui-layer">
    <a href="index.html" class="top-left-btn" aria-label="Go Back">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>

    <button class="auto-rotate-btn" id="autoRotateBtn">Auto Rotate Off</button>

    <div class="menu-box" id="menuBox">
      <div class="menu-header">
        <span class="menu-title">MODEL MENU</span>
        <button class="eye-btn" id="eyeToggleBtn" aria-label="Toggle Menu">
          <svg id="eyeIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="menu-body" id="menuBody">
        <button class="menu-btn menu-btn-upload" id="uploadBtn">
          <span>UPLOAD PNG</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </button>
        <input type="file" id="file-input" accept="image/png, image/jpeg">

        <button class="menu-btn active" data-model="batsman_full.obj">BATSMAN_1</button>
        <button class="menu-btn" data-model="batsman_half.obj">BATSMAN_2</button>
        <button class="menu-btn" data-model="fielder_full.obj">FIELDER_1</button>
        <button class="menu-btn" data-model="fielder_half.obj">FIELDER_2</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let scene, camera, renderer, controls;
      let currentModel = null;
      let loadedTexture = null;
      let isAutoRotating = false;

      const modelCache = new Map();

      const container = document.getElementById("webgl-container");
      const autoRotateBtn = document.getElementById("autoRotateBtn");
      const menuBox = document.getElementById("menuBox");
      const menuBody = document.getElementById("menuBody");
      const eyeToggleBtn = document.getElementById("eyeToggleBtn");
      const eyeIcon = document.getElementById("eyeIcon");
      const uploadBtn = document.getElementById("uploadBtn");
      const fileInput = document.getElementById("file-input");
      const modelBtns = document.querySelectorAll("[data-model]");

      function initThree() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Adjusted camera distance and elevation for framing
        camera.position.set(0, 0.1, 4.2);

        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 10;
        controls.minDistance = 0.8;
        controls.target.set(0, 0.1, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const mainDirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainDirLight.position.set(5, 10, 7);
        scene.add(mainDirLight);

        const fillLight = new THREE.DirectionalLight(0x0088ff, 0.4);
        fillLight.position.set(-5, -5, -5);
        scene.add(fillLight);

        loadOBJModel("batsman_full.obj");
        setTimeout(triggerMenuAnimations, 200);

        function animate() {
          requestAnimationFrame(animate);
          
          if (isAutoRotating && currentModel) {
            currentModel.rotation.y += 0.01;
          }

          controls.update();
          renderer.render(scene, camera);
        }
        animate();
      }

      function triggerMenuAnimations() {
        const allBtns = menuBody.querySelectorAll(".menu-btn");
        allBtns.forEach((btn, index) => {
          btn.classList.remove("slide-active");
          btn.style.animationDelay = `${index * 0.08}s`;
          void btn.offsetWidth;
          btn.classList.add("slide-active");
        });
      }

      function loadOBJModel(fileName) {
        if (modelCache.has(fileName)) {
          displayModel(modelCache.get(fileName).clone());
          return;
        }

        const loader = new THREE.OBJLoader();
        loader.load(
          `assets/${fileName}`,
          (obj) => {
            modelCache.set(fileName, obj);
            displayModel(obj.clone());
          },
          undefined,
          (err) => console.warn(`Error loading assets/${fileName}:`, err)
        );
      }

      function displayModel(obj) {
        if (currentModel) scene.remove(currentModel);

        currentModel = obj;

        const box = new THREE.Box3().setFromObject(obj);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        // Center origin
        obj.position.x -= center.x;
        obj.position.y -= center.y;
        obj.position.z -= center.z;

        // Scale fitting logic tailored to narrow mobile screens
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          const targetScale = 1.35; // Prevents T-pose arms from going out of bounds
          const scale = targetScale / maxDim;
          obj.scale.set(scale, scale, scale);
        }

        // Lift model slightly so feet clear the bottom UI box
        obj.position.y += 0.15;

        applyMaterialToModel(currentModel);
        scene.add(currentModel);
      }

      function applyMaterialToModel(model) {
        if (!model) return;

        model.traverse((child) => {
          if (child.isMesh) {
            if (loadedTexture) {
              child.material = new THREE.MeshStandardMaterial({
                map: loadedTexture,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide
              });
            } else {
              child.material = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                roughness: 0.5,
                metalness: 0.1
              });
            }
            child.material.needsUpdate = true;
          }
        });
      }

      autoRotateBtn.addEventListener("click", () => {
        isAutoRotating = !isAutoRotating;
        autoRotateBtn.textContent = isAutoRotating ? "Auto Rotate On" : "Auto Rotate Off";
        autoRotateBtn.classList.toggle("active", isAutoRotating);
      });

      eyeToggleBtn.addEventListener("click", () => {
        const isCollapsed = menuBox.classList.toggle("collapsed");
        if (isCollapsed) {
          eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
        } else {
          eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
          triggerMenuAnimations();
        }
      });

      modelBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          modelBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          loadOBJModel(btn.getAttribute("data-model"));
        });
      });

      uploadBtn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(event.target.result, (tex) => {
              tex.encoding = THREE.sRGBEncoding;
              tex.wrapS = THREE.RepeatWrapping;
              tex.wrapT = THREE.RepeatWrapping;
              tex.flipY = true;
              tex.needsUpdate = true;

              loadedTexture = tex;
              applyMaterialToModel(currentModel);
            });
          };
          reader.readAsDataURL(file);
        }
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      initThree();
    });
  </script>
  
  <!-- Include Global Audio Manager -->
<script src="audio-manager.js"></script>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('PWA Offline Cache Active:', reg.scope);

          // Check for service worker updates periodically
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('New content available! Please refresh.');
                // Optional: Trigger a custom UI notification banner here
              }
            });
          });
        })
        .catch(err => {
          console.error('Service Worker registration failed:', err);
        });
    });
  }
</script>

</body>
</html>
